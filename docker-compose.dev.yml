name: dexhub-dev

services:
  postgres:
    ports:
      - "5432:5432"
    networks:
      - internal
      - external

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile.dev
    volumes:
      - ./apps/api:/app/apps/api:delegated
      - ./packages:/app/packages:delegated
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/packages/config/node_modules
      - /app/packages/db/node_modules
      - /app/packages/sdk/node_modules
      - /app/packages/ui/node_modules
      - /app/packages/worklog-engine/node_modules
    environment:
      NODE_ENV: development
    ports:
      - "3001:3001"
    networks:
      - internal
      - external

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile.dev
    volumes:
      - ./apps/web:/app/apps/web:delegated
      - ./packages:/app/packages:delegated
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/apps/web/.next
    environment:
      NODE_ENV: development
    ports:
      - "3000:3000"
    networks:
      - internal
      - external

networks:
  external:
    internal: false
